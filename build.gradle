plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'net.neoforged.licenser' version '0.7.5'
    id 'dev.sciwhiz12.gradle.simplversion' version '0.2.0'
}

versions {
    stripPattern = /^\d+\.\d+(?:\.[\dx]+)?-/
}
version = versions.version
println "Mod version: $version"

sourceSets {
    shared
    client.resources {
        srcDirs += 'src/data/clientResources'
        exclude '.cache/'
    }
    server.resources {
        srcDirs += 'src/data/serverResources'
        exclude '.cache/'
    }

    data.resources {
        srcDirs += 'src/data/clientResources'
        srcDirs += 'src/data/serverResources'
        exclude '.cache/'
    }
}

base {
    archivesName = "${project.name}-${mc_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

print "Java: ${System.getProperty('java.version')}"
print ", JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')})"
println ", Arch: ${System.getProperty('os.arch')}"

neoForge {
    version = project.neoforge_version

    addModdingDependenciesTo sourceSets.shared
    addModdingDependenciesTo sourceSets.client
    addModdingDependenciesTo sourceSets.server
    addModdingDependenciesTo sourceSets.data

    runs {
        configureEach {
            gameDirectory = project.file("runs/$name")
        }

        client {
            client()

            sourceSet = sourceSets.main
        }

        clientAuth {
            client()
            devLogin = true
            ideName = "Client (with Auth)"
            gameDirectory = project.file("runs/client")

            sourceSet = sourceSets.main
        }

        server {
            server()

            programArgument '--nogui'

            sourceSet = sourceSets.server
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', modid, '--all'

            programArguments.addAll '--output', sourceSets.client.resources.srcDirs[2].toString()
            programArguments.addAll '--existing', sourceSets.shared.resources.srcDirs.toString()

            sourceSet = sourceSets.data
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', modid, '--all'

            programArguments.addAll '--output', sourceSets.server.resources.srcDirs[2].toString()
            programArguments.addAll '--existing', sourceSets.shared.resources.srcDirs.toString()

            sourceSet = sourceSets.data
        }
    }

    mods {
        "${modid}" {
            sourceSet sourceSets.shared
            sourceSet sourceSets.client
            sourceSet sourceSets.server
            sourceSet sourceSets.main
            sourceSet sourceSets.data
        }
    }
}

configurations {
    clientImplementation.extendsFrom sharedImplementation
    serverImplementation.extendsFrom sharedImplementation
    implementation.extendsFrom clientImplementation
    implementation.extendsFrom serverImplementation
    dataImplementation.extendsFrom implementation

    serverLibrary
    serverImplementation.extendsFrom serverLibrary
}

repositories {
    mavenCentral()
}

dependencies {
    serverLibrary("net.dv8tion:JDA:$jda_version") {
        exclude module: 'opus-java'
        exclude module: 'slf4j-api'
        exclude module: 'annotations'
        exclude module: 'jsr305'
        exclude module: 'gson'
    }

    clientImplementation sourceSets.shared.output
    serverImplementation sourceSets.shared.output
    implementation sourceSets.client.output
    implementation sourceSets.server.output
    dataImplementation sourceSets.main.output
}

license {
    header = project.file('HEADER.txt')
}

var manifestAttributes = [
        'Specification-Title'   : modid,
        'Specification-Vendor'  : author,
        'Specification-Version' : versions.rawVersion,
        'Implementation-Title'  : project.name,
        'Implementation-Version': versions.version,
        'Implementation-Vendor' : author,
        "Git-Commit"            : versions.fullCommitId,
        "Git-Commit-Timestamp"  : versions.commitTimestamp
] as LinkedHashMap

tasks.withType(Jar).configureEach {
    manifest.attributes(manifestAttributes)
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    from sourceSets.shared.output
    from sourceSets.client.output
    from sourceSets.server.output
    archiveClassifier.set('lite')
}

tasks.named('sourcesJar', Jar).configure {
    from sourceSets.shared.allSource
    from sourceSets.client.allSource
    from sourceSets.server.allSource
}

@SuppressWarnings('GrMethodMayBeStatic')
def relocate(origin) {
    shadowJar.relocate(origin, "dev.sciwhiz12.concord.shadow.$origin")
}

// noinspection UnnecessaryQualifiedReference
tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    archiveClassifier.set('')

    from sourceSets.shared.output
    from sourceSets.client.output
    from sourceSets.server.output
    configurations = [project.configurations.serverLibrary]

    relocate 'com.iwebpp.crypto'
    relocate 'org.json'
    relocate 'net.sf.trove4j'
    relocate 'gnu.trove'
    // Can't relocate 'com.google' because that would touch references to Guava classes
    relocate 'com.google.crypto'
    relocate 'com.google.errorprone'
    relocate 'com.google.protobuf'

    relocate 'com.neovisionaries.ws.client'
    relocate 'okio'
    relocate 'okhttp3'
    relocate 'kotlin'

    relocate 'org.apache.commons.collections4'
    relocate 'javax.annotation'
    relocate 'com.fasterxml.jackson'

    relocate 'net.dv8tion.jda'
    relocate 'club.minnced.discord.webhook'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/proguard/**'
    exclude 'META-INF/services/**'
    exclude 'META-INF/versions/9/module-info.class'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'module-info.class'
}

tasks.named('assemble') {
    dependsOn shadowJar
}

tasks.named('javadoc', Javadoc).configure {
    failOnError = false

    options.addStringOption('Xdoclint:all,-missing', '-public')
    options {
        tags = [
                'apiNote:a:<em>API Note:</em>',
                'implSpec:a:<em>Implementation Requirements:</em>',
                'implNote:a:<em>Implementation Note:</em>'
        ]

        author = false
        noSince = true
        noHelp = true
    }
}

publishing {
    publications.create('mavenJava', MavenPublication) {
        it.from components.java

        it.version = "$mc_version-${versions.rawVersion}${versions.snapshot ? '-SNAPSHOT' : ''}"
    }

    repositories {
        maven {
            name = 'projectLocal'
            url = "file://${project.file('repo').absolutePath}"
        }
    }
}
